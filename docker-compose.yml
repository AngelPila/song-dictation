services:
  web:
    build: .
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped
  api:
    build: ./api
    environment:
      # vacía = búsqueda automática apagada; la app sigue funcionando pegando el link
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
    volumes:
      - api-cache:/data
    restart: unless-stopped

volumes:
  api-cache:
